<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JNM Referrals</title>
<meta name="apple-mobile-web-app-title" content="JNM Referrals">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  color-scheme: dark;
  --bg:#000000; --panel:#0c1014; --field:#141a20; --line:#222b33; --line-soft:#1a2128;
  --text:#eef3f6; --muted:#8a96a0; --cyan:#22d3ee; --cyan-ink:#0b4552; --warn:#f5b84a; --bad:#f07171; --good:#4ade80;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000000; --panel:#0c1014; } }
:root[data-theme="dark"]{ --bg:#000000; --panel:#0c1014; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--mono); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); }
button,input,select,textarea{ font:inherit; color:inherit; }
a{ color:var(--cyan); }
:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
.wrap{ max-width:620px; margin:0 auto; padding:0 16px 48px; }

/* header */
header.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); border-bottom:1px solid var(--line); }
.top-in{ max-width:620px; margin:0 auto; padding:14px 16px 12px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
.brand{ display:flex; align-items:center; gap:10px; min-width:0; }
.brand img{ height:34px; width:auto; display:block; }
.brand-txt{ line-height:1.05; }
.brand-txt b{ display:block; font-family:var(--sans); font-weight:700; font-size:19px; letter-spacing:-.01em; }
.brand-txt span{ display:block; color:var(--cyan); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; margin-top:3px; white-space:nowrap; }
.earn{ text-align:right; flex-shrink:0; }
.earn small{ display:block; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--text); }
.earn strong{ display:block; font-family:var(--sans); font-size:30px; font-weight:700; line-height:1.05; padding-bottom:6px; border-bottom:3px solid var(--cyan); min-width:96px; transition:color .2s; }
.earn strong.bump{ color:var(--cyan); }
.earn strong .per{ font-size:15px; font-weight:600; color:var(--cyan); margin-left:3px; letter-spacing:0; }

/* tabs */
nav.tabs{ max-width:620px; margin:0 auto; display:flex; gap:20px; padding:0 16px; overflow-x:auto; scrollbar-width:none; }
nav.tabs::-webkit-scrollbar{ display:none; }
nav.tabs button{ background:none; border:0; padding:14px 2px 11px; font-size:13px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--text); border-bottom:3px solid transparent; white-space:nowrap; cursor:pointer; }
nav.tabs button[aria-selected="true"]{ color:var(--cyan); border-bottom-color:var(--cyan); }

/* sections */
.sec{ background:var(--panel); border:1px solid var(--line); border-radius:4px; margin-top:18px; }
.sec-h{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; }
.sec-h .n{ color:var(--cyan); font-family:var(--sans); font-weight:700; font-size:15px; margin-right:10px; }
.sec-h .aside{ color:var(--muted); font-size:11px; }
.sec-b{ padding:16px; }
label.l, .l{ display:block; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; margin:0 0 7px; }
.field{ margin-bottom:14px; }
.row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:420px){ .row{ grid-template-columns:1fr; } }
input.in, select.in, textarea.in{ width:100%; background:var(--field); border:1px solid var(--line); border-radius:3px; padding:13px 12px; font-size:16px; outline:none; }
textarea.in{ resize:vertical; min-height:74px; }
input.in:focus, select.in:focus, textarea.in:focus{ border-color:var(--cyan); }
input.in::placeholder, textarea.in::placeholder{ color:#56616b; }

/* selector buttons */
.opts{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.opts.three{ grid-template-columns:repeat(3,1fr); }
.opt{ background:var(--field); border:1px solid var(--line); border-radius:3px; padding:14px 8px 12px; text-align:center; cursor:pointer; min-height:68px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
.opt b{ font-family:var(--sans); font-weight:700; font-size:14.5px; line-height:1.15; }
.opt span{ font-size:12px; color:var(--muted); }
.opt[aria-pressed="true"]{ background:var(--cyan); border-color:var(--cyan); }
.opt[aria-pressed="true"] b{ color:#00151a; }
.opt[aria-pressed="true"] span{ color:var(--cyan-ink); }
#projOpts .opt:last-child:nth-child(odd){ grid-column:1 / -1; min-height:52px; }
.opt.slim{ min-height:0; padding:12px 6px; }
.opt.slim b{ font-family:var(--mono); font-weight:600; font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; }

/* callout like the calculator */
.need{ border-left:3px solid var(--cyan); background:var(--field); padding:12px 14px; font-size:13.5px; margin-top:4px; }
.need.ok{ border-left-color:var(--good); }
.need.err{ border-left-color:var(--bad); }

/* toggles */
.tog{ display:flex; align-items:center; gap:14px; padding:12px 0; cursor:pointer; }
.tog + .tog{ border-top:1px solid var(--line-soft); }
.tog input{ position:absolute; opacity:0; width:1px; height:1px; }
.sw{ width:50px; height:30px; border-radius:15px; background:#2a3138; position:relative; flex-shrink:0; transition:background .15s; }
.sw::after{ content:""; position:absolute; top:4px; left:4px; width:22px; height:22px; border-radius:50%; background:#e7dfe8; transition:transform .15s; }
.tog input:checked + .sw{ background:var(--cyan); }
.tog input:checked + .sw::after{ transform:translateX(20px); background:#fff; }
.tog input:focus-visible + .sw{ outline:2px solid var(--cyan); outline-offset:2px; }
.tog .t{ font-family:var(--sans); font-weight:600; font-size:15px; }
.tog .t small{ display:block; font-family:var(--mono); font-weight:400; color:var(--muted); font-size:12px; margin-top:2px; }

/* buttons */
.btn{ display:block; width:100%; border:0; border-radius:3px; background:var(--cyan); color:#00151a; font-weight:700; letter-spacing:.12em; text-transform:uppercase; font-size:14px; padding:17px; cursor:pointer; margin-top:18px; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btn.ghost{ background:var(--field); color:var(--text); border:1px solid var(--line); }
.btn.sm{ display:inline-block; width:auto; padding:10px 14px; font-size:12px; margin:0; }
.linkbtn{ background:none; border:0; color:var(--cyan); padding:0; cursor:pointer; font-size:13px; text-decoration:underline; text-underline-offset:3px; }

.sending-as{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.sending-as b{ font-family:var(--sans); font-size:15px; }
.muted{ color:var(--muted); }
.small{ font-size:12.5px; }

/* success */
.done{ text-align:center; padding:34px 18px 26px; }
.done .big{ font-family:var(--sans); font-weight:700; font-size:54px; line-height:1; color:var(--cyan); margin:10px 0 6px; }
.done h2{ font-size:14px; letter-spacing:.16em; text-transform:uppercase; margin:0; }
.check{ width:58px; height:58px; margin:0 auto 6px; border:2px solid var(--cyan); border-radius:50%; display:grid; place-items:center; }
@media (prefers-reduced-motion:no-preference){ .check{ animation:pop .45s ease-out; } @keyframes pop{ 0%{ transform:scale(.6); opacity:0 } 70%{ transform:scale(1.08) } 100%{ transform:scale(1); opacity:1 } } }

/* lists */
.item{ padding:14px 16px; border-top:1px solid var(--line); }
.item:first-child{ border-top:0; }
.item-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
.item-top b{ font-family:var(--sans); font-size:15.5px; }
.badge{ font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; padding:4px 8px; border-radius:2px; border:1px solid var(--line); white-space:nowrap; }
.st-new{ color:var(--cyan); border-color:var(--cyan); }
.st-contacted,.st-appointment{ color:var(--warn); border-color:#5a4520; }
.st-sold{ color:var(--good); border-color:#1f5a35; }
.st-paid{ background:var(--good); color:#03210f; border-color:var(--good); }
.st-dead{ color:var(--muted); }
.empty{ padding:26px 16px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:3px; margin:16px; }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:4px; overflow:hidden; margin-top:18px; }
.stats.four{ grid-template-columns:repeat(4,1fr); }
@media (max-width:460px){ .stats.four{ grid-template-columns:repeat(2,1fr); } }
.stat{ background:var(--panel); padding:12px; }
.stat small{ display:block; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.stat b{ display:block; font-family:var(--sans); font-size:22px; margin-top:4px; }
.stat b.c{ color:var(--cyan); }
.steps{ margin:0; padding:0; list-style:none; counter-reset:s; }
.steps li{ counter-increment:s; display:grid; grid-template-columns:30px 1fr; gap:6px; padding:12px 0; border-top:1px solid var(--line-soft); }
.steps li:first-child{ border-top:0; padding-top:0; }
.steps li::before{ min-width:0; content:counter(s); color:var(--cyan); font-family:var(--sans); font-weight:700; font-size:16px; }
.steps b{ font-family:var(--sans); display:block; font-size:15px; }
.tier{ display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line-soft); }
.tier:first-child{ border-top:0; padding-top:0; }
.tier b{ font-family:var(--sans); color:var(--cyan); }

/* admin */
.filters{ display:flex; gap:6px; overflow-x:auto; padding:14px 16px 2px; scrollbar-width:none; }
.filters::-webkit-scrollbar{ display:none; }
.chip{ background:var(--field); border:1px solid var(--line); border-radius:2px; padding:8px 10px; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; white-space:nowrap; }
.chip[aria-pressed="true"]{ background:var(--cyan); border-color:var(--cyan); color:#00151a; font-weight:600; }
.kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px; margin-top:10px; }
.kv dt{ color:var(--muted); }
.kv dd{ margin:0; overflow-wrap:anywhere; }
.status-row{ display:grid; grid-template-columns:repeat(6,1fr); gap:4px; margin-top:12px; }
@media (max-width:480px){ .status-row{ grid-template-columns:repeat(3,1fr); } }
.status-row button{ background:var(--field); border:1px solid var(--line); border-radius:2px; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:9px 2px; cursor:pointer; }
.status-row button[aria-pressed="true"]{ background:var(--cyan); color:#00151a; border-color:var(--cyan); font-weight:700; }
.pay-row{ display:flex; gap:8px; align-items:center; margin-top:10px; }
.pay-row input{ max-width:120px; padding:9px 10px; font-size:15px; }
.new-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--cyan); margin-right:8px; vertical-align:middle; }
.demo{ background:#1a1405; border:1px solid #5a4520; color:var(--warn); font-size:12.5px; padding:9px 12px; border-radius:3px; margin-top:14px; }
.toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--cyan); color:#00151a; font-weight:600; padding:12px 18px; border-radius:3px; font-size:13.5px; z-index:20; max-width:90vw; }
.foot{ text-align:center; margin-top:30px; font-size:12px; color:var(--muted); }
.foot button{ font-size:12px; color:var(--muted); }
.hidden{ display:none !important; }
.intro h1{ font-family:var(--sans); font-size:24px; line-height:1.15; letter-spacing:-.01em; margin:0 0 10px; max-width:22ch; }
.intro p{ margin:0; font-size:14px; max-width:46ch; }
.need.warn{ border-left-color:var(--warn); }
.need.warn b{ color:var(--warn); font-weight:600; }
.badge.ps-pending{ color:var(--warn); border-color:#5a4520; }
.badge.ps-approved{ color:var(--good); border-color:#1f5a35; }
.badge.ps-declined,.badge.ps-deactivated{ color:var(--bad); border-color:#5a2424; }
.kv .badge{ font-size:9.5px; padding:2px 6px; margin-left:4px; }
.count{ display:inline-block; background:var(--warn); color:#1a1405; border-radius:9px; font-size:10.5px; padding:1px 6px; margin-left:4px; letter-spacing:0; }
.opt[aria-pressed="true"] .count{ background:#00151a; color:var(--cyan); }
.act-row{ display:flex; gap:8px; margin-top:12px; }
.act-row:empty{ display:none; }
.stat b.w{ color:var(--warn); }
input.in.code{ font-size:24px; letter-spacing:.4em; text-align:center; font-weight:600; }
.sans{ font-family:var(--sans); }
.track{ display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-top:14px; }
.track div{ font-size:10.5px; line-height:1.25; color:var(--muted); letter-spacing:.02em; }
.track div::before{ content:""; display:block; height:5px; border-radius:2px; background:var(--line); margin-bottom:7px; }
.track div.on{ color:var(--text); }
.track div.on::before{ background:var(--cyan); }
.track div.cur{ color:var(--cyan); font-weight:600; }
.track time{ display:block; color:var(--muted); font-weight:400; margin-top:2px; }
.next{ margin-top:10px; color:var(--muted); }
.next.installed,.next.paid{ color:var(--good); }
.item.dim .track div.on::before{ background:#3a4651; }
.upd{ display:inline-block; font-size:10px; letter-spacing:.1em; text-transform:uppercase; background:var(--cyan); color:#00151a; padding:2px 6px; border-radius:2px; margin-left:6px; vertical-align:2px; font-weight:600; }
.st-signed{ color:var(--good); border-color:#1f5a35; }
.st-installed{ color:#00151a; background:var(--cyan); border-color:var(--cyan); }
.status-row{ grid-template-columns:repeat(7,1fr) !important; }
@media (max-width:520px){ .status-row{ grid-template-columns:repeat(4,1fr) !important; } }
.bonus-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; padding:10px 12px; background:var(--field); border:1px solid var(--line); border-radius:3px; font-size:13px; }
.bonus-row b{ font-family:var(--sans); color:var(--cyan); }
.ps-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.ps-row button{ background:var(--field); border:1px solid var(--line); border-radius:2px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:9px 2px; cursor:pointer; }
.ps-row button[aria-pressed="true"]{ background:var(--cyan); color:#00151a; border-color:var(--cyan); font-weight:700; }
</style>
</head>

  if (to === "dead"){ p.dead_at = now; return p; }
  p.dead_at = null; const i = ORDER.indexOf(to);
  ORDER.forEach((k, idx) => { if (idx === 0) return; const col = k + "_at"; if (idx > i) p[col] = null; else if (idx === i && !r[col]) p[col] = now; });

}

const api = {
  async tiers(){

  /* sign-in (email code) — the same for partners and the owner */

  },
  async sendCode(email){
    if (!LIVE) return;
    const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } }); if (error) throw error;
  },
  async verifyCode(email, code, role){

    let { error } = await sb.auth.verifyOtp({ email, token:code, type:"email" });
    if (error) ({ error } = await sb.auth.verifyOtp({ email, token:code, type:"signup" }));
    if (error) throw new Error("That code isn't right or has expired. Use the code from the most recent email, or request a new one.");
  },
  async signOut(role){ if (!LIVE){ store.set(demoSess(role), null); return; } await sb.auth.signOut(); },

  /* partner */
  async myPartner(){
    if (!LIVE){ const e = store.get(demoSess("partner"), null); const db = demoDB.load(); const p = db.partners.find(p => p.email === e); if (!p) return null;
      const rec = db.partners.find(x => x.id === p.recruited_by); return { payout_status:"not_invited", ...p, recruited_by_name: rec ? rec.name.split(" ")[0] : null }; }
    const d = await rpc("my_partner"); return (d && d[0]) || null;
  },
  async apply(p){
    if (!LIVE){
      const db = demoDB.load(); const email = store.get(demoSess("partner"), null);
      if (db.partners.some(x => x.phone === digits(p.phone) && x.email !== email)) throw new Error("That phone number is already on another partner account");
      const code = (p.name.replace(/[^A-Za-z]/g,"").slice(0,4) || "JNM").toUpperCase() + "-" + Math.random().toString(36).slice(2,6).toUpperCase();

  },
  async submitReferral(r){

      demoDB.save(db); return tier.amount;

  },
  async myReferrals(){
    if (!LIVE){
      const db = demoDB.load(); const e = store.get(demoSess("partner"), null); const p = db.partners.find(x => x.email === e); if (!p) return [];

  },
  async myRecruits(){
    if (!LIVE){
      const db = demoDB.load(); const e = store.get(demoSess("partner"), null); const me = db.partners.find(x => x.email === e); if (!me) return [];
      return db.partners.filter(p => p.recruited_by === me.id).map(p => { const rs = db.referrals.filter(r => r.partner_id === p.id && r.recruiter_id === me.id);

  },
  async settings(){

const MONEY_STAGES = ["installed","paid"];
function needsSetup(p, refs){
  if (!p || p.status !== "approved" || (p.payout_status || "not_invited") === "ready") return false;
  return (p.referrals || []).some(r => MONEY_STAGES.includes(r.status)) || refs.some(r => r.recruiter_id === p.id && MONEY_STAGES.includes(r.status));
}
function qbBox(p, why){
  if (!p) return "";
  const first = esc((p.name || "").split(" ")[0]); const invited = (p.payout_status || "not_invited") === "invited";
  return `<div class="need warn qb" style="margin-top:12px"><b>${invited ? `Waiting on ${first}'s QuickBooks setup` : `First payout: set up ${first} in QuickBooks`}</b>
    <div class="small" style="margin-top:6px">${invited ? `${first} was sent the QuickBooks invite. Mark them ready once direct deposit is set up.` : `${why} Add ${first} in QuickBooks as a contractor with "Invite to enter their info" on, then tap Mark invited.`}</div>
    <div style="display:flex;gap:16px;margin-top:10px;flex-wrap:wrap"><button class="linkbtn" data-qbcopy="${p.id}">Copy info for QuickBooks</button>${invited ? `<button class="linkbtn" data-qbset="ready" data-pidx="${p.id}">Mark ready to pay</button>` : `<button class="linkbtn" data-qbset="invited" data-pidx="${p.id}">Mark invited</button>`}</div></div>`;
}
async function copyQB(p){
  const txt = [p.partner_type === "Realtor" && p.brokerage ? `Pay to: ${p.brokerage} (agent: ${p.name})` : p.name, p.email, fmtPhone(p.phone)].join("\n");
  try { await navigator.clipboard.writeText(txt); toast("Copied. In QuickBooks: Payroll → Contractors → Add a contractor"); } catch { prompt("Copy this:", txt); }
}
function wireQB(root, ps){
  root.querySelectorAll("[data-qbcopy]").forEach(b => b.onclick = () => copyQB(ps.find(x => x.id === b.dataset.qbcopy)));
  root.querySelectorAll("[data-qbset]").forEach(b => b.onclick = async () => {
    try { await api.updatePartner(b.dataset.pidx, { payout_status:b.dataset.qbset }); toast("Payout setup: " + PAYOUT_SETUP[b.dataset.qbset]); viewOwner(); } catch(e){ toast("Couldn't update: " + e.message); }
  });
}
function partnerBadge(s){ return s && s !== "approved" ? ` <span class="badge ps-${s}">Partner ${PSTATUS[s].toLowerCase()}</span>` : ""; }

function ownerReferrals(refs, ps){
  ps = ps || [];
  const f = state.adminFilter;
  const counts = Object.fromEntries(STATUSES.map(s => [s.key, refs.filter(r => r.status === s.key).length]));
  const list = f === "all" ? refs : refs.filter(r => r.status === f);
  const tierLabel = k => (state.tiers.find(t => t.key === k) || {}).label || k;
  $("#aBody").innerHTML = `
    <section class="sec">
      <div class="filters" id="flt">
        ${[["all","All",refs.length], ...STATUSES.map(s => [s.key, s.label, counts[s.key]])].map(([k,v,c]) => `<button class="chip" data-f="${k}" aria-pressed="${f===k}">${v} ${c}</button>`).join("")}
      </div>
      <div style="margin-top:12px">
      ${list.length ? list.map(r => { const p = r.partners || {}; return `
        <div class="item" data-id="${r.id}">
          <div class="item-top">
            <div><b>${r.status==="new" ? '<span class="new-dot"></span>' : ""}${esc(r.client_name)}</b><div class="small muted">${esc(tierLabel(r.project_type))} · ${fmtDate(r.created_at)}</div></div>
            <span class="badge st-${r.status}">${esc((STATUSES.find(s=>s.key===r.status)||{}).label)}</span>
          </div>
          <dl class="kv">
            <dt>Phone</dt><dd><a href="tel:${digits(r.client_phone)}">${esc(fmtPhone(r.client_phone))}</a></dd>
            <dt>Address</dt><dd><a href="https://maps.google.com/?q=${encodeURIComponent(r.client_address)}" target="_blank" rel="noopener">${esc(r.client_address)}</a></dd>
            ${r.notes ? `<dt>Notes</dt><dd>${esc(r.notes)}</dd>` : ""}
            <dt>From</dt><dd>${esc(p.name)} · ${esc(p.partner_type)}${p.brokerage ? " · " + esc(p.brokerage) : ""}${p.company ? " · " + esc(p.company) : ""}${partnerBadge(p.status)}<br><a href="tel:${digits(p.phone)}">${esc(fmtPhone(p.phone))}</a>${p.email ? ` · <a href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : ""}</dd>
          </dl>
          ${STAMPS.some(k => r[k]) ? `<div class="small muted" style="margin-top:8px">${STAMPS.filter(k => r[k]).map(k => `${(STATUSES.find(s => s.key === k.replace("_at","")) || {}).label} ${shortDate(r[k])}`).join(" · ")}</div>` : ""}
          <div class="status-row">${STATUSES.map(s => `<button data-s="${s.key}" aria-pressed="${r.status===s.key}">${s.label}</button>`).join("")}</div>
          <div class="pay-row"><span class="l" style="margin:0">Payout $</span><input class="in" type="number" inputmode="numeric" min="0" step="25" value="${+r.payout}" data-pay>${r.paid_at ? `<span class="small muted">Paid ${fmtDate(r.paid_at)}</span>` : ""}</div>
          ${r.recruiter_id ? (() => { const rec = ps.find(x => x.id === r.recruiter_id); const due = ["installed","paid"].includes(r.status);
            return `<div class="bonus-row"><span>Recruiter bonus <b>${money(r.recruiter_bonus)}</b> to ${esc(rec ? rec.name : "recruiter")}${due ? (r.recruiter_paid_at ? ` · <span style="color:var(--good)">paid ${shortDate(r.recruiter_paid_at)}</span>` : ` · <span style="color:var(--warn)">owed</span>`) : ` · <span class="muted">due at install</span>`}</span>${due ? `<button class="linkbtn" data-bonus>${r.recruiter_paid_at ? "Undo" : "Mark bonus paid"}</button>` : ""}</div>`; })() : ""}
          ${MONEY_STAGES.includes(r.status) && r.status !== "paid" ? (() => { const pp = ps.find(x => x.id === r.partner_id) || r.partners; return pp && pp.status === "approved" && (pp.payout_status || "not_invited") !== "ready" ? qbBox({ ...r.partners, ...pp }, `This job is installed and ${money(r.payout)} is owed.`) : ""; })() : ""}
          ${r.recruiter_id && MONEY_STAGES.includes(r.status) && !r.recruiter_paid_at ? (() => { const rp = ps.find(x => x.id === r.recruiter_id); return rp && rp.status === "approved" && (rp.payout_status || "not_invited") !== "ready" ? qbBox(rp, `Their ${money(r.recruiter_bonus)} recruiter bonus is owed.`) : ""; })() : ""}
          ${state.justUpdated === r.id ? updateRow(r) : ""}
        </div>`; }).join("") : `<div class="empty">${f==="new" ? "No new referrals right now. New ones land here first." : "Nothing in this stage."}</div>`}
      </div>
    </section>`;
  $("#flt").onclick = e => { const b = e.target.closest("[data-f]"); if (!b) return; state.adminFilter = b.dataset.f; state.justUpdated = null; ownerReferrals(refs, ps); };
  $("#aBody").querySelectorAll(".item[data-id]").forEach(el => {
    const r = refs.find(x => x.id === el.dataset.id);
    el.querySelector(".status-row").onclick = async e => {
      const b = e.target.closest("[data-s]"); if (!b || b.dataset.s === r.status) return;
      if (b.dataset.s === "paid" && r.partners?.status !== "approved" && !confirm("This partner isn't approved. Mark the referral paid anyway?")) return;
      const patch = statusPatch(r, b.dataset.s);
      try { await api.updateReferral(r.id, patch); toast(`Marked ${b.textContent.toLowerCase()}`); state.justUpdated = r.id; state.adminFilter = b.dataset.s; viewOwner(); } catch(err){ toast("Couldn't update: " + err.message); }
    };
    wireQB(el, ps);
    const bb = el.querySelector("[data-bonus]");
    if (bb) bb.onclick = async () => { try { await api.updateReferral(r.id, { recruiter_paid_at: r.recruiter_paid_at ? null : new Date().toISOString() }); toast(r.recruiter_paid_at ? "Bonus marked unpaid" : "Bonus marked paid"); viewOwner(); } catch(err){ toast("Couldn't update: " + err.message); } };
    el.querySelector("[data-pay]").onchange = async e => {
      const v = Math.max(0, +e.target.value || 0);
      try { await api.updateReferral(r.id, { payout:v }); r.payout = v; toast("Payout saved"); } catch(err){ toast("Couldn't save: " + err.message); }
    };
  });
}

function updateRow(r){
  const p = r.partners || {}; const first = (p.name || "").split(" ")[0]; const client = (r.client_name || "").split(" ")[0];
  const line = {
    new: `we received your referral for ${client}.`,
    contacted: `we've reached out to ${client}.`,
    appointment: `we have an appointment set with ${client}.`,
    signed: `${client} signed a contract! Your ${money(r.payout)} payout is sent once the job is installed.`,
    installed: `${client}'s job is installed. Your ${money(r.payout)} payout is on the way.` + ((p.payout_status || "not_invited") !== "ready" ? ` You'll get an email from QuickBooks shortly to set up direct deposit so we can send it.` : ""),
    paid: `your ${money(r.payout)} payout for ${client} has been sent. Thank you!`,
    dead: `${client} decided not to move forward right now. Thanks for the referral, and keep them coming.`
  }[r.status];
  const msg = `Hi ${first}, update on your JNM referral: ${line} Track it anytime at ${appLink()}`;
  return `<div class="need ok" style="margin-top:12px">Let ${esc(first)} know:
    <div class="small muted" style="margin-top:6px">${esc(msg)}</div>
    <div style="display:flex;gap:16px;margin-top:8px"><a href="sms:${digits(p.phone)}?&body=${encodeURIComponent(msg)}">Text them</a>${p.email ? `<a href="mailto:${esc(p.email)}?subject=${encodeURIComponent("Update on your JNM referral")}&body=${encodeURIComponent(msg)}">Email them</a>` : ""}<button class="linkbtn" onclick="state.justUpdated=null;this.closest('.need').remove()">Skip</button></div></div>`;
}

function ownerPartners(ps, refs){
  refs = refs || [];
  const counts = Object.fromEntries(Object.keys(PSTATUS).map(k => [k, ps.filter(p => p.status === k).length]));
  counts.setup = ps.filter(p => needsSetup(p, refs)).length;
  if (!state.partnerFilter) state.partnerFilter = counts.pending ? "pending" : counts.setup ? "setup" : "approved";
  const f = state.partnerFilter;
  const list = f === "all" ? ps : f === "setup" ? ps.filter(p => needsSetup(p, refs)) : ps.filter(p => p.status === f);
  $("#aBody").innerHTML = `
    <section class="sec">
      <div class="sec-h"><span>Partners</span><button class="linkbtn" id="inv" style="font-size:12px">Copy invite link</button></div>
      <div class="filters" id="pflt">
        ${[["pending","Applications"],["setup","Payout setup"],["approved","Approved"],["declined","Declined"],["deactivated","Inactive"],["all","All"]].map(([k,v]) => `<button class="chip" data-f="${k}" aria-pressed="${f===k}">${v} ${k==="all" ? ps.length : counts[k]}</button>`).join("")}
      </div>
      <div style="margin-top:12px">
      ${list.length ? list.map(p => { const rec = ps.find(x => x.id === p.recruited_by); const recruits = ps.filter(x => x.recruited_by === p.id).length; const rs = p.referrals || []; const owed = rs.filter(r=>r.status==="installed").reduce((s,r)=>s + +r.payout,0); const pd = rs.filter(r=>r.status==="paid").reduce((s,r)=>s + +r.payout,0); return `
        <div class="item" data-pid="${p.id}">
          <div class="item-top"><div><b>${esc(p.name)}</b><div class="small muted">${esc(p.partner_type)}${p.brokerage ? " · " + esc(p.brokerage) : ""}${p.company ? " · " + esc(p.company) : ""}</div></div>
            <span class="badge ps-${p.status}">${PSTATUS[p.status]}</span></div>
          <dl class="kv">
            <dt>Phone</dt><dd><a href="tel:${digits(p.phone)}">${esc(fmtPhone(p.phone))}</a></dd>
            <dt>Email</dt><dd><a href="mailto:${esc(p.email)}">${esc(p.email)}</a></dd>
            <dt>Applied</dt><dd>${fmtDate(p.created_at)}</dd>
            <dt>Referrals</dt><dd>${rs.length} sent${owed ? ` · <span style="color:var(--warn)">${money(owed)} owed</span>` : ""}${pd ? ` · ${money(pd)} paid` : ""}</dd>
            ${rec ? `<dt>Recruited by</dt><dd>${esc(rec.name)}</dd>` : ""}
            ${recruits ? `<dt>Recruits</dt><dd>${recruits} partner${recruits > 1 ? "s" : ""}</dd>` : ""}
          </dl>
          ${p.status === "approved" && (needsSetup(p, refs) || (p.payout_status || "not_invited") !== "not_invited") ? `<span class="l" style="margin:14px 0 6px">Payout setup · QuickBooks</span>
          <div class="ps-row">${Object.entries(PAYOUT_SETUP).map(([k,v]) => `<button data-ps="${k}" aria-pressed="${(p.payout_status || "not_invited") === k}">${v}</button>`).join("")}</div>
          <button class="linkbtn" data-qb style="margin-top:10px;font-size:12.5px">Copy info for QuickBooks</button>` : p.status === "approved" ? `<div class="small muted" style="margin-top:12px">QuickBooks setup: after their first installed job</div>` : ""}
          <div class="act-row">
            ${p.status === "pending" ? `<button class="btn sm" data-act="approved">Approve</button><button class="btn sm ghost" data-act="declined">Decline</button>` : ""}
            ${p.status === "approved" ? `<button class="btn sm ghost" data-act="deactivated">Deactivate</button>` : ""}
            ${p.status === "declined" || p.status === "deactivated" ? `<button class="btn sm ghost" data-act="approved">Approve</button>` : ""}
          </div>
          ${state.justApproved === p.id ? notifyRow(p) : ""}
        </div>`; }).join("")
      : `<div class="empty">${f==="pending" ? "No applications waiting. Share your invite link to bring in partners." : "No partners here."}</div>`}
      </div>
    </section>`;
  $("#pflt").onclick = e => { const b = e.target.closest("[data-f]"); if (!b) return; state.partnerFilter = b.dataset.f; state.justApproved = null; ownerPartners(ps, refs); };
  $("#inv").onclick = async () => { try { await navigator.clipboard.writeText(appLink()); toast("Invite link copied"); } catch { prompt("Copy this link:", appLink()); } };
  $("#aBody").querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
    const id = b.closest("[data-pid]").dataset.pid; const to = b.dataset.act; const p = ps.find(x => x.id === id);
    if (to !== "approved" && !confirm(`${to === "declined" ? "Decline" : "Deactivate"} ${p.name}? They won't be able to send referrals.`)) return;
    try {
      await api.updatePartner(id, { status:to, decided_at:new Date().toISOString() });
      p.status = to; state.justApproved = to === "approved" ? id : null;
      toast(`${p.name} ${PSTATUS[to].toLowerCase()}`);
      if (to === "approved"){ state.partnerFilter = "approved"; }
      viewOwner();
    } catch(e){ toast("Couldn't update: " + e.message); }
  });
  $("#aBody").querySelectorAll("[data-ps]").forEach(b => b.onclick = async () => {
    const id = b.closest("[data-pid]").dataset.pid;
    try { await api.updatePartner(id, { payout_status:b.dataset.ps }); toast("Payout setup: " + PAYOUT_SETUP[b.dataset.ps]); viewOwner(); } catch(e){ toast("Couldn't update: " + e.message); }
  });
  $("#aBody").querySelectorAll("[data-qb]").forEach(b => b.onclick = () => copyQB(ps.find(x => x.id === b.closest("[data-pid]").dataset.pid)));
}
function notifyRow(p){
  const first = (p.name || "").split(" ")[0];
  const msg = `Hi ${first}, you're approved as a JNM Referral Partner! Send referrals anytime at ${appLink()} and track every step there. When your first referral is installed, we'll send you a quick QuickBooks setup for direct deposit. Want to earn more? Check the Invite & earn tab for your personal link. Thank you, JNM Renovation & Construction`;
  return `<div class="need ok" style="margin-top:12px">Let ${esc(first)} know they're approved:
    <div style="display:flex;gap:16px;margin-top:8px"><a href="sms:${digits(p.phone)}?&body=${encodeURIComponent(msg)}">Text them</a><a href="mailto:${esc(p.email)}?subject=${encodeURIComponent("You're approved: JNM Referral Partner")}&body=${encodeURIComponent(msg)}">Email them</a></div></div>`;
}

function ownerPayouts(){
  $("#aBody").innerHTML = `<section class="sec"><div class="sec-h"><span>Payout per project type</span><span class="aside">Partners see these</span></div>
    <div class="sec-b">${state.tiers.map(t => `<div class="tier" style="align-items:center"><span>${esc(t.label)}</span><span style="display:flex;align-items:center;gap:6px">$<input class="in" style="width:100px;padding:8px 10px;font-size:15px" type="number" min="0" step="25" value="${+t.amount}" data-k="${t.key}"></span></div>`).join("")}
    <p class="small muted" style="margin:14px 0 0">Changes apply to new referrals. Existing referrals keep the payout they were sent with, and you can adjust any one of them on its card.</p></div></section>
    <section class="sec"><div class="sec-h"><span>Recruiter bonus</span><span class="aside">One level only</span></div>
    <div class="sec-b"><div class="tier" style="align-items:center"><span>Per installed job from a recruited partner</span><span style="display:flex;align-items:center;gap:6px">$<input class="in" style="width:100px;padding:8px 10px;font-size:15px" type="number" min="0" step="5" value="${+state.bonus}" id="bonusIn"></span></div>
    <p class="small muted" style="margin:14px 0 0">Paid to the partner who invited them, on top of the referral payout. Applies to new referrals.</p></div></section>`;
  $("#bonusIn").onchange = async () => { const v = Math.max(0, +$("#bonusIn").value || 0); try { await api.saveBonus(v); state.bonus = v; toast("Recruiter bonus updated"); } catch(e){ toast("Couldn't save: " + e.message); } };
  $("#aBody").querySelectorAll("[data-k]").forEach(inp => inp.onchange = async () => {
    const v = Math.max(0, +inp.value || 0);
    try { await api.saveTier(inp.dataset.k, v); state.tiers.find(t => t.key === inp.dataset.k).amount = v; toast("Payout updated"); } catch(e){ toast("Couldn't save: " + e.message); }
  });
}

function exportCSV(refs, ps){
  ps = ps || [];
  const cols = ["created_at","status","contacted_at","appointment_at","signed_at","installed_at","client_name","client_phone","client_address","project","notes","payout","paid_at","partner_name","partner_status","partner_phone","partner_email","partner_type","brokerage","company","recruiter","recruiter_bonus","recruiter_bonus_paid_at"];
  const rows = refs.map(r => { const p = r.partners || {}; return [r.created_at, r.status, r.contacted_at, r.appointment_at, r.signed_at, r.installed_at, r.client_name, fmtPhone(r.client_phone), r.client_address, (state.tiers.find(t=>t.key===r.project_type)||{}).label, r.notes, r.payout, r.paid_at, p.name, p.status, fmtPhone(p.phone), p.email, p.partner_type, p.brokerage, p.company, (ps.find(x => x.id === r.recruiter_id) || {}).name, r.recruiter_bonus, r.recruiter_paid_at]; });
  const csv = [cols, ...rows].map(row => row.map(v => `"${String(v ?? "").replace(/"/g,'""')}"`).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv" }));
  a.download = `jnm-referrals-${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- boot ---------- */
(async function(){
  try { const t = await api.tiers(); if (t && t.length) state.tiers = t; } catch(e){ console.warn("Using default payouts", e); }
  try { const st = await api.settings(); if (st && st.recruiter_bonus != null) state.bonus = +st.recruiter_bonus; } catch(e){ console.warn("Using default bonus", e); }
  render();
  if (LIVE) setInterval(() => { if (route() === "owner" && document.visibilityState === "visible" && !document.activeElement?.matches("input,textarea")) viewOwner(); }, 60000);
})();

</script>
</body>
</html>
